<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Falguni Admin Dashboard
</title>


<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>


<!-- Font Awesome -->
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>


</head>


<body class="bg-gray-100">



<!-- Header -->
<header class="bg-[#1e3a8a] text-white shadow-lg">

    <div class="container mx-auto px-6 py-4 flex justify-between items-center">

        <div>

            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-print"></i>
                Falguni Upload Portal
            </h1>

            <p class="text-sm text-blue-200">
                Admin Dashboard
            </p>

        </div>


        <div class="text-right">

            <p class="text-sm">
                Total Orders
            </p>

            <p id="totalOrders"
               class="text-xl font-bold">
                0
            </p>

        </div>

    </div>

</header>



<div class="container mx-auto px-4 md:px-6 py-6">


    <!-- Toolbar -->

    <div class="
        bg-white
        rounded-xl
        shadow-md
        p-4
        mb-6
        flex
        flex-wrap
        gap-3
        items-center
        justify-between
    ">


        <label class="
            flex
            items-center
            gap-2
            cursor-pointer
        ">

            <input 
                type="checkbox"
                id="selectAll"
                class="w-4 h-4 text-blue-600 rounded"
            >

            <strong class="text-gray-700">
                Select All
            </strong>

        </label>



        <div class="flex gap-3">


            <button 
                id="refreshBtn"
                class="
                bg-gray-600
                hover:bg-gray-700
                text-white
                px-4
                py-2
                rounded-lg
                flex
                items-center
                gap-2
                "
            >

                <i class="fa-solid fa-rotate"></i>

                Refresh

            </button>



            <button
                id="downloadSelectedBtn"
                class="
                bg-green-600
                hover:bg-green-700
                text-white
                px-4
                py-2
                rounded-lg
                flex
                items-center
                gap-2
                "
            >

                <i class="fa-solid fa-box-archive"></i>

                Download Selected ZIP

            </button>


        </div>


    </div>





    <!-- Orders -->

    <div id="ordersContainer"
         class="space-y-4">


        <div class="
            bg-white
            rounded-xl
            shadow-md
            p-8
            text-center
            text-gray-500
        ">

            <i class="
                fa-solid
                fa-folder-open
                text-4xl
                mb-3
            "></i>


            <p>
                No Files Found
            </p>


        </div>


    </div>


</div>





<script src="admin.js"></script>



<script>


// ------------------------------------
// Render Order Card
// ------------------------------------


function renderOrder(order,index){


    let filesHtml = "";



    order.files.forEach(file=>{


        let icon =
            file.mimetype.includes("image")
            ?
            "fa-image text-purple-500"
            :
            "fa-file text-blue-500";



        let sizeKB =
            (
                file.size / 1024
            ).toFixed(2);




        filesHtml += `


        <div class="
            flex
            items-center
            justify-between
            py-2
            border-b
            last:border-0
        ">



            <div class="
                flex
                items-center
                gap-3
            ">


                <i class="
                    fa-solid
                    ${icon}
                "></i>



                <span class="text-gray-800">

                    ${
                        file.downloaded
                        ?
                        "✅"
                        :
                        "⬜"
                    }

                    ${file.displayName}

                </span>



                <span class="
                    text-xs
                    bg-gray-200
                    px-2
                    py-1
                    rounded
                ">

                    ${sizeKB} KB

                </span>


            </div>





            <button


onclick="
    downloadFile(
        '${file.downloadUrl}',
        this,
        '${file.displayName}'
    )
"



            class="

            ${
                file.downloaded

                ?

                `
                bg-green-600
                cursor-not-allowed
                `

                :

                `
                bg-blue-600
                hover:bg-blue-700
                `

            }


            text-white
            px-3
            py-1.5
            rounded-lg
            text-sm
            flex
            items-center
            gap-1

            "


            ${file.downloaded ? "disabled":""}


            >



            <i class="
                fa-solid

                ${
                    file.downloaded
                    ?
                    "fa-check"
                    :
                    "fa-download"
                }

            "></i>



            ${
                file.downloaded
                ?
                "Downloaded"
                :
                "Download"
            }



            </button>



        </div>


        `;



    });





    return `


    <div class="
        bg-white
        rounded-xl
        shadow-md
        p-5
    ">



        <div class="
            flex
            flex-wrap
            justify-between
            items-center
            mb-3
            pb-3
            border-b
        ">


            <div>


                <p class="
                    text-sm
                    text-gray-500
                ">

                    Order #${index+1}

                </p>



                <p class="
                    font-bold
                    text-[#1e3a8a]
                ">

                    ${order.jobId}

                </p>


            </div>





            <div class="text-right">


                <p class="
                    text-sm
                    text-gray-500
                ">


                ${
                    new Date(
                        order.uploadedAt
                    )
                    .toLocaleString(
                        "en-IN"
                    )
                }


                </p>



                <p class="font-semibold">

                    ${order.files.length}
                    Files

                </p>


            </div>





            <div class="flex gap-2 mt-2">


                <button

                onclick="
                downloadZip(
                    '${order.jobId}'
                )
                "

                class="
                bg-green-600
                hover:bg-green-700
                text-white
                px-4
                py-2
                rounded-lg
                text-sm
                "

                >

                <i class="fa-solid fa-box-archive"></i>

                ZIP

                </button>




                <button

                onclick="
                deleteOrder(
                    '${order.jobId}'
                )
                "

                class="
                bg-red-500
                hover:bg-red-600
                text-white
                px-4
                py-2
                rounded-lg
                text-sm
                "

                >

                <i class="fa-solid fa-trash"></i>

                Delete

                </button>



            </div>



        </div>





        <div>

            ${filesHtml}

        </div>



    </div>


    `;


}





// ------------------------------------
// Single Download
// ------------------------------------


async function downloadFile(url,btn){


try{


    btn.disabled=true;


    btn.innerHTML =

    `
    <i class="
    fa-solid
    fa-spinner
    fa-spin
    "></i>

    Downloading...
    `;



    const response =
        await fetch(url);



    const blob =
        await response.blob();



    const blobUrl =
        window.URL.createObjectURL(blob);



    const a =
        document.createElement("a");



    a.href=blobUrl;

    a.download="";



    document.body.appendChild(a);


    a.click();


    a.remove();



    window.URL.revokeObjectURL(blobUrl);



    btn.innerHTML=

    `
    <i class="fa-solid fa-check"></i>

    Downloaded
    `;


    btn.className=

    `
    bg-green-600
    text-white
    px-3
    py-1.5
    rounded-lg
    text-sm
    flex
    items-center
    gap-1
    cursor-not-allowed
    `;



}


catch(err){


    console.error(err);


    btn.disabled=false;


    btn.innerHTML=

    `
    <i class="fa-solid fa-download"></i>

    Download
    `;


    alert(
        "Download failed"
    );


}


}


</script>
