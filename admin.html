<title>Falguni Upload Portal - Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- ================= HEADER ================= -->

<header class="bg-blue-900 text-white shadow-lg">

    <div class="container mx-auto px-6 py-4 flex justify-between items-center">

        <div>

            <h1 class="text-2xl font-bold flex items-center gap-2">

                <i class="fa-solid fa-print"></i>

                Falguni Upload Portal

            </h1>

            <p class="text-blue-200 text-sm">

                Admin Dashboard

            </p>

        </div>

        <div class="text-right">

            <p class="text-sm">

                Total Orders

            </p>

            <p
                id="totalOrders"
                class="text-3xl font-bold">

                0

            </p>

        </div>

    </div>

</header>

<!-- ================= CONTENT ================= -->

<div class="container mx-auto px-4 py-6">

    <!-- Toolbar -->

    <div
        class="bg-white rounded-xl shadow-md p-4 mb-6 flex justify-between items-center">

        <h2
            class="font-semibold text-lg text-gray-700">

            Uploaded Orders

        </h2>

        <button
            id="refreshBtn"
            class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-2 rounded-lg transition flex items-center gap-2">

            <i class="fa-solid fa-rotate"></i>

            Refresh

        </button>

    </div>

    <!-- Orders -->

    <div
        id="ordersContainer"
        class="space-y-5">

        <div
            class="bg-white rounded-xl shadow-md p-10 text-center text-gray-500">

            <i
                class="fa-solid fa-folder-open text-5xl mb-4"></i>

            <p>

                No Files Found

            </p>

        </div>

    </div>

</div>

<!-- ================= JS ================= -->

<script src="admin.js"></script>
